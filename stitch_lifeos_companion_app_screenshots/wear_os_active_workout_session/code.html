letterSpacing": "0.01em", "fontWeight": "600" }], "title-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "600" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100vh;background-color:#000000;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface-container-lowest font-body-md text-body-md text-on-surface antialiased flex flex-col items-center justify-start min-h-screen"><main class="flex flex-col relative w-full max-w-sm mx-auto px-margin min-h-screen justify-center items-center"><div class="flex flex-col w-full items-center justify-center select-none py-space-xs">
<div class="relative w-[360px] h-[360px] rounded-full bg-surface-container-lowest overflow-hidden flex flex-col items-center justify-between p-space-md shadow-2xl">
<!-- AMOLED Radial Bezel Arc & Peripheral Header -->
<div class="absolute inset-0 pointer-events-none">
<svg class="w-full h-full -rotate-90" fill="none" viewBox="0 0 360 360">
<!-- Inactive Background Ring Track -->
<circle cx="180" cy="180" r="172" stroke="#1e2025" stroke-dasharray="1080" stroke-dashoffset="360" stroke-linecap="round" stroke-width="6"></circle>
<!-- Zone 4 Threshold Active Arc (Energetic Amber/Terracotta) -->
<circle class="transition-all duration-700 ease-out" cx="180" cy="180" id="hr-arc" r="172" stroke="#f17f5b" stroke-dasharray="1080" stroke-dashoffset="640" stroke-linecap="round" stroke-width="6"></circle>
</svg>
</div>
<!-- Top Screen Inset: Bezel Time, Status Pill & Zone Readout -->
<div class="relative z-10 w-full flex flex-col items-center pt-space-xs">
<div class="flex items-center justify-between w-full px-space-xl">
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium tracking-wider">10:42</span>
<div class="flex items-center gap-space-xs bg-surface-container-high px-2 py-0.5 rounded-full">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-secondary animate-ping"></span>
<span class="font-label-sm text-label-sm text-secondary font-bold tracking-tight">RUN</span>
</div>
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-[13px] text-secondary">satellite_alt</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">LTE</span>
</div>
</div>
<!-- Heart Rate Zone Badge -->
<div class="mt-0.5 px-2.5 py-0.5 rounded-full bg-tertiary-container/30 flex items-center gap-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary-container"></span>
<span class="font-label-sm text-label-sm text-tertiary font-bold tracking-widest uppercase">Zone 4 • Threshold</span>
</div>
</div>
<!-- Glanceable Hero Metric: Heart Rate & Live Pulse -->
<div class="relative z-10 flex items-baseline justify-center gap-2 mt-0.5">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[26px] text-tertiary-container animate-pulse" id="heart-glyph" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="font-display-md-mobile text-display-md-mobile font-bold text-on-surface tabular-nums tracking-tighter" id="bpm-val">174</span>
</div>
<span class="font-label-md text-label-md text-tertiary font-bold tracking-wider">BPM</span>
</div>
<!-- 2x2 Contoured AMOLED Modular Metrics Grid -->
<div class="relative z-10 w-full px-space-sm grid grid-cols-2 gap-1.5">
<!-- Metric A: Elapsed Duration -->
<div class="bg-surface-container rounded-lg p-2 flex flex-col items-center justify-center">
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase">Time</span>
<span class="font-title-lg text-title-lg font-bold text-on-surface tabular-nums tracking-tight" id="duration-val">37:57</span>
</div>
<!-- Metric B: Distance -->
<div class="bg-surface-container rounded-lg p-2 flex flex-col items-center justify-center">
<div class="flex items-baseline gap-1">
<span class="font-title-lg text-title-lg font-bold text-on-surface tabular-nums tracking-tight">4.82</span>
<span class="font-label-sm text-label-sm text-secondary font-bold">KM</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase">Distance</span>
</div>
<!-- Metric C: Live Pace -->
<div class="bg-surface-container rounded-lg p-2 flex flex-col items-center justify-center">
<div class="flex items-baseline gap-0.5">
<span class="font-title-lg text-title-lg font-bold text-on-surface tabular-nums tracking-tight">5:18</span>
<span class="font-label-sm text-label-sm text-primary font-medium">/KM</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase">Pace</span>
</div>
<!-- Metric D: Active Calories -->
<div class="bg-surface-container rounded-lg p-2 flex flex-col items-center justify-center">
<div class="flex items-baseline gap-1">
<span class="font-title-lg text-title-lg font-bold text-on-surface tabular-nums tracking-tight">385</span>
<span class="font-label-sm text-label-sm text-tertiary font-bold">KCAL</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase">Energy</span>
</div>
</div>
<!-- Cadence & Sync Telemetry Pill -->
<div class="relative z-10 flex items-center justify-center gap-1.5 px-3 py-0.5 rounded-full bg-surface-container-low text-on-surface-variant">
<span class="material-symbols-outlined text-[14px] text-secondary">location_on</span>
<span class="font-label-sm text-label-sm font-medium tracking-tight">GPS Locked</span>
<span class="text-outline-variant">•</span>
<span class="material-symbols-outlined text-[14px] text-primary">directions_run</span>
<span class="font-label-sm text-label-sm font-medium tracking-tight">172 spm</span>
</div>
<!-- Tactile Wrist Action Controls Docked to Circular Bezel Arc -->
<div class="relative z-10 w-full pb-1 px-space-md flex items-center justify-center gap-2">
<!-- Lap Marker Mini Action Pill -->
<button class="w-10 h-10 rounded-full bg-surface-container-high active:scale-90 flex items-center justify-center text-on-surface transition-transform duration-150" id="btn-lap">
<span class="material-symbols-outlined text-[18px]">flag</span>
</button>
<!-- Primary Action Pill: Pause / Resume Workout -->
<button class="flex-1 max-w-[140px] h-11 rounded-full bg-tertiary-container active:scale-95 text-on-tertiary-container flex items-center justify-center gap-1.5 shadow-lg transition-transform duration-150" id="btn-pause">
<span class="material-symbols-outlined text-[20px]" id="pause-icon" style="font-variation-settings: 'FILL' 1;">pause</span>
<span class="font-label-md text-label-md font-bold uppercase tracking-wider" id="pause-text">Pause</span>
</button>
<!-- Wearable Audio Handoff / Music Widget Quick Access -->
<button class="w-10 h-10 rounded-full bg-surface-container-high active:scale-90 flex items-center justify-center text-primary transition-transform duration-150" id="btn-music">
<span class="material-symbols-outlined text-[18px]">headphones</span>
</button>
</div>
<!-- Interactive Lap Visual Splash Toast (Hidden by default) -->
<div class="absolute inset-0 bg-surface/90 backdrop-blur-md rounded-full flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200 z-30" id="lap-toast">
<div class="w-12 h-12 rounded-full bg-secondary/20 flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-secondary text-[28px]">check_circle</span>
</div>
<span class="font-headline-sm text-headline-sm font-bold text-on-surface">Lap 5</span>
<span class="font-label-md text-label-md text-secondary-fixed-dim">05:12 • Fast Pace!</span>
</div>
<div class="absolute bottom-2 left-0 right-0 flex items-center justify-center gap-1.5 z-20 pointer-events-none"><span class="w-1.5 h-1.5 rounded-full bg-outline-variant/60"></span><span class="w-1.5 h-1.5 rounded-full bg-outline-variant/60"></span><span class="w-2.5 h-1.5 rounded-full bg-primary"></span><span class="w-1.5 h-1.5 rounded-full bg-outline-variant/60"></span><span class="w-1.5 h-1.5 rounded-full bg-outline-variant/60"></span></div></div>
</div>
<script>
  (function () {
    const pauseBtn = document.getElementById('btn-pause');
    const pauseIcon = document.getElementById('pause-icon');
    const pauseText = document.getElementById('pause-text');
    const lapBtn = document.getElementById('btn-lap');
    const lapToast = document.getElementById('lap-toast');
    const bpmElement = document.getElementById('bpm-val');
    const durationElement = document.getElementById('duration-val');
    const heartGlyph = document.getElementById('heart-glyph');

    let isPaused = false;
    let secondsElapsed = 1934;

    // Tactile Workout Toggle Micro-interaction
    pauseBtn.addEventListener('click', () => {
      if ('vibrate' in navigator) navigator.vibrate(40);
      isPaused = !isPaused;
      if (isPaused) {
        pauseBtn.classList.remove('bg-tertiary-container', 'text-on-tertiary-container');
        pauseBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
        pauseIcon.textContent = 'play_arrow';
        pauseText.textContent = 'Resume';
        heartGlyph.classList.remove('animate-pulse');
      } else {
        pauseBtn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
        pauseBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
        pauseIcon.textContent = 'pause';
        pauseText.textContent = 'Pause';
        heartGlyph.classList.add('animate-pulse');
      }
    });

    // Lap Toast Confirmation
    lapBtn.addEventListener('click', () => {
      if ('vibrate' in navigator) navigator.vibrate([30, 40, 30]);
      lapToast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        lapToast.classList.add('opacity-0', 'pointer-events-none');
      }, 1200);
    });

    // Time & Biometric Telemetry Drift Simulation
    setInterval(() => {
      if (!isPaused) {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        durationElement.textContent = `${mins}:${secs}`;
      }
    }, 1000);

    // Natural heart rate oscillation
    setInterval(() => {
      if (!isPaused) {
        const delta = Math.floor(Math.random() * 3) - 1;
        const currentBpm = parseInt(bpmElement.textContent, 10);
        const nextBpm = Math.min(176, Math.max(160, currentBpm + delta));
        bpmElement.textContent = String(nextBpm);
      }
    }, 2400);
  })();
</script></main>

</body></html>

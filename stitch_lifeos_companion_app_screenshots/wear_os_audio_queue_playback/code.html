<script>
  // Simple micro-interactions tailored for Wear OS tactile response
  const playBtn = document.getElementById('playback-btn');
  const playIcon = document.getElementById('play-icon');
  let isPlaying = true;

  if (playBtn && playIcon) {
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
    });
  }

  // Favorite toggle states
  document.querySelectorAll('.like-toggle').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const icon = btn.querySelector('.material-symbols-outlined');
      const isFilled = icon.style.fontVariationSettings?.includes("'FILL' 1");
      if (isFilled) {
        icon.style.fontVariationSettings = "'FILL' 0";
        btn.classList.remove('text-tertiary');
        btn.classList.add('text-outline-variant');
      } else {
        icon.style.fontVariationSettings = "'FILL' 1";
        btn.classList.remove('text-outline-variant');
        btn.classList.add('text-tertiary');
      }
    });
  });

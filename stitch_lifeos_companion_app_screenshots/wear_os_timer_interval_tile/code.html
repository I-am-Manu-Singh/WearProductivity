<script>
  (function initWearOSTimer() {
    let totalSec = 285;
    let tenths = 8;
    let isRunning = true;
    const maxIntervalSec = 300;
    const perimeter = 552.92;

    const minSecEl = document.getElementById('timerMinSec');
    const msEl = document.getElementById('timerMs');
    const arcEl = document.getElementById('progressArc');
    const toggleBtn = document.getElementById('mainToggleBtn');
    const toggleIcon = document.getElementById('mainToggleIcon');
    const toggleLabel = document.getElementById('mainToggleLabel');
    const addBtn = document.getElementById('addTimeBtn');
    const resetBtn = document.getElementById('resetLapBtn');

    function updateDisplay() {
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      minSecEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      msEl.textContent = '.' + tenths;

      const progressRatio = Math.max(0, Math.min(1, totalSec / maxIntervalSec));
      const offset = perimeter * (1 - progressRatio);
      arcEl.style.strokeDashoffset = offset.toFixed(1);
    }

    let timerInterval = setInterval(() => {
      if (!isRunning) return;
      if (tenths > 0) {
        tenths--;
      } else {
        tenths = 9;
        if (totalSec > 0) {
          totalSec--;
        } else {
          totalSec = 0;
          isRunning = false;
        }
      }
      updateDisplay();
    }, 100);

    toggleBtn.addEventListener('click', () => {
      isRunning = !isRunning;
      if (isRunning) {
        toggleIcon.textContent = 'pause';
        toggleLabel.textContent = 'PAUSE';
        toggleBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
        toggleBtn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
      } else {
        toggleIcon.textContent = 'play_arrow';
        toggleLabel.textContent = 'RESUME';
        toggleBtn.classList.remove('bg-tertiary-container', 'text-on-tertiary-container');
        toggleBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
      }
    });

    addBtn.addEventListener('click', () => {
      totalSec = Math.min(maxIntervalSec, totalSec + 60);
      updateDisplay();
    });

    resetBtn.addEventListener('click', () => {
      totalSec = maxIntervalSec;
      tenths = 0;
      updateDisplay();
    });
  })();
</script></main>

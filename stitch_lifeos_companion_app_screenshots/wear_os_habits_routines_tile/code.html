<div class="flex items-center gap-2.5 min-w-0">

<path class="text-secondary stroke-current" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke-dasharray="100, 100" stroke-linecap="round" stroke-width="3.5"></path>

</div>
</div>

<button aria-label="Start 10 minute meditation" class="flex-shrink-0 px-3 py-1.5 rounded-full bg-primary text-on-primary flex items-center gap-1 shadow-sm active:scale-95 transition-transform" id="zen-trigger-btn">

<button class="w-full h-10 rounded-full bg-surface-container-high hover:bg-surface-bright active:scale-95 transition-all duration-150 flex items-center justify-between px-3.5 shadow-sm text-on-surface" id="routine-pill-btn">

</div>
</div>
</div>
<script>
  // Wear OS Tactile Feedback Simulation
  const triggerBtn = document.getElementById('zen-trigger-btn');
  const routineBtn = document.getElementById('routine-pill-btn');

  function hapticPulse(el) {
    if (navigator.vibrate) {
      navigator.vibrate(30);
    }
    el.classList.add('brightness-125');
    setTimeout(() => {
      el.classList.remove('brightness-125');
    }, 180);
  }

  if (triggerBtn) {
    triggerBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      hapticPulse(triggerBtn);
      const label = triggerBtn.querySelector('span:last-child');
      if (label) {
        label.textContent = label.textContent === 'START' ? 'PAUSE' : 'START';
      }
    });
  }

  if (routineBtn) {
    routineBtn.addEventListener('click', () => {
      hapticPulse(routineBtn);
    });
  }
</script></main></div>

<!DOCTYPE html><html class="dark" lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#000000;color:#e2e2e9;font-family:'Roboto Flex',sans-serif;}body{overscroll-behavior:none;overflow-x:hidden;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}*{-webkit-tap-highlight-color:transparent;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"primary-fixed-dim":"#b3c5ff","on-surface-variant":"#c4c6d4","secondary-container":"#18a47e","on-primary-fixed-variant":"#0940a0","tertiary-fixed":"#ffdbd0","surface-container":"#1e2025","on-primary-fixed":"#001849","surface-variant":"#33353a","secondary-fixed":"#80f8cd","on-primary-container":"#003080","error":"#ffb4ab","on-error-container":"#ffdad6","surface-bright":"#37393f","primary-container":"#769bff","surface-dim":"#111318","tertiary-container":"#f17f5b","surface-container-highest":"#33353a","on-tertiary":"#5e1700","inverse-surface":"#e2e2e9","on-surface":"#e2e2e9","secondary":"#62dbb2","tertiary-fixed-dim":"#ffb59e","inverse-on-surface":"#2e3036","background":"#111318","outline":"#8e909e","surface":"#111318","on-tertiary-fixed-variant":"#7f2a0d","on-secondary-fixed-variant":"#00513d","error-container":"#93000a","on-secondary-container":"#003123","surface-container-lowest":"#0c0e13","on-primary":"#002b75","on-tertiary-container":"#681a00","primary":"#b3c5ff","on-error":"#690005","on-tertiary-fixed":"#3a0b00","primary-fixed":"#dae1ff","on-secondary":"#003829","surface-tint":"#b3c5ff","inverse-primary":"#3059b9","surface-container-high":"#282a2f","surface-container-low":"#1a1b21","secondary-fixed-dim":"#62dbb2","on-background":"#e2e2e9","outline-variant":"#434652","on-secondary-fixed":"#002117","tertiary":"#ffb59e"},"borderRadius":{"DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px"},"spacing":{"gutter-sm":"0.5rem","margin":"1rem","space-sm":"0.5rem","space-xs":"0.25rem","margin-lg":"2rem","space-xl":"2.25rem","gutter-lg":"1.5rem","space-md":"1rem","gutter":"1rem","space-lg":"1.5rem","margin-sm":"0.75rem"},"fontFamily":{"label-md":["Roboto Flex"],"body-sm":["Roboto Flex"],"title-md":["Roboto Flex"],"body-md":["Roboto Flex"],"display-md":["Roboto Flex"],"body-lg":["Roboto Flex"],"headline-lg":["Roboto Flex"],"display-lg-mobile":["Roboto Flex"],"label-lg":["Roboto Flex"],"title-sm":["Roboto Flex"],"headline-sm":["Roboto Flex"],"headline-md":["Roboto Flex"],"display-lg":["Roboto Flex"],"display-md-mobile":["Roboto Flex"],"label-sm":["Roboto Flex"],"title-lg":["Roboto Flex"]},"fontSize":{"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.04em","fontWeight":"600"}],"body-sm":["12px",{"lineHeight":"16px","letterSpacing":"0.03em","fontWeight":"400"}],"title-md":["16px",{"lineHeight":"24px","letterSpacing":"0.01em","fontWeight":"600"}],"body-md":["14px",{"lineHeight":"20px","letterSpacing":"0.02em","fontWeight":"400"}],"display-md":["44px",{"lineHeight":"52px","letterSpacing":"-0.01em","fontWeight":"700"}],"body-lg":["16px",{"lineHeight":"24px","letterSpacing":"0.02em","fontWeight":"400"}],"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.01em","fontWeight":"600"}],"display-lg-mobile":["40px",{"lineHeight":"48px","letterSpacing":"-0.02em","fontWeight":"700"}],"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.03em","fontWeight":"600"}],"title-sm":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"600"}],"headline-sm":["22px",{"lineHeight":"28px","letterSpacing":"0em","fontWeight":"600"}],"headline-md":["26px",{"lineHeight":"32px","letterSpacing":"0em","fontWeight":"600"}],"display-lg":["56px",{"lineHeight":"64px","letterSpacing":"-0.02em","fontWeight":"700"}],"display-md-mobile":["32px",{"lineHeight":"40px","letterSpacing":"-0.01em","fontWeight":"700"}],"label-sm":["10px",{"lineHeight":"14px","letterSpacing":"0.06em","fontWeight":"700"}],"title-lg":["20px",{"lineHeight":"26px","letterSpacing":"0em","fontWeight":"500"}]}}}}</script></head><body class="bg-[#000000] text-on-surface select-none flex justify-center items-center min-h-screen overflow-x-hidden"><div class="relative w-[384px] h-[384px] max-w-full rounded-full bg-[#000000] overflow-hidden flex flex-col justify-center items-center shadow-[0_0_60px_rgba(0,0,0,0.9)]"><main class="flex-1 flex flex-col relative w-full h-full justify-center items-center p-6 bg-[#000000]"><div class="flex flex-col w-full h-full items-center justify-between select-none relative overflow-y-auto overflow-x-hidden pt-2 pb-3 px-3 text-on-surface" style="scrollbar-width: none;">
<!-- Ambient Top Curved Rim Telemetry -->

<!-- Scrollable Hardware Architecture Stack -->
<div class="w-full flex flex-col items-center space-y-2.5 my-auto z-10 px-1">
<!-- Central Device Identity Hero Card -->
<div class="w-full bg-surface-container-low rounded-lg p-3 flex flex-col items-center text-center relative overflow-hidden transition-all duration-300">
<div class="absolute -top-12 -right-12 w-28 h-28 bg-primary-container/10 rounded-full blur-xl pointer-events-none"></div>
<!-- Stylized Pixel Watch 3 & Phone Pairing Graphic -->
<div class="relative flex items-center justify-center my-1">
<!-- Watch Silhouette Visual -->
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center relative shadow-sm">
<div class="w-9 h-9 rounded-full bg-surface-dim flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">watch</span>
</div>
<span class="absolute -right-0.5 top-1/2 -translate-y-1/2 w-1.5 h-3 bg-outline rounded-r-sm"></span>
</div>
<!-- Bi-directional Peer Connector -->
<div class="flex items-center px-1.5 space-x-0.5">
<span class="w-1 h-1 rounded-full bg-secondary animate-ping"></span>
<div class="w-3 h-0.5 bg-secondary-container"></div>
<span class="material-symbols-outlined text-primary text-[14px]">sync_alt</span>
</div>
<!-- Phone Silhouette Visual -->
<div class="w-7 h-12 rounded-[8px] bg-surface-container-highest flex flex-col items-center justify-between p-0.5">
<div class="w-2.5 h-0.5 bg-outline-variant rounded-full mt-0.5"></div>
<span class="material-symbols-outlined text-on-surface-variant text-[14px]">smartphone</span>
<div class="w-2 h-0.5 bg-outline-variant rounded-full mb-0.5"></div>
</div>
</div>
<!-- Identity Meta -->
<h1 class="font-title-sm text-title-sm text-on-surface tracking-tight mt-1 truncate max-w-full">
        Pixel Watch 3 <span class="text-primary font-normal text-body-sm">45mm LTE</span>
</h1>
<!-- Status Chip with M3 Expressive container -->
<div class="mt-1.5 inline-flex items-center px-2 py-0.5 rounded-full bg-surface-container-highest"><span class="w-1.5 h-1.5 rounded-full bg-secondary mr-1.5"></span><span class="text-[12px] font-label-sm text-secondary font-bold tracking-wide uppercase">Connected</span></div>
</div>
<!-- 2x2 Dense Wear OS Telemetry Grid -->
<div class="grid grid-cols-2 gap-1.5 w-full"><div class="bg-surface-container-low rounded-lg p-2 flex flex-col items-center justify-center text-center"><span class="text-[10px] font-label-sm uppercase tracking-wider text-on-surface-variant">Throughput</span><span class="text-[14px] font-bold text-primary font-title-sm mt-0.5">1.2 MB/s</span></div><div class="bg-surface-container-low rounded-lg p-2 flex flex-col items-center justify-center text-center"><span class="text-[10px] font-label-sm uppercase tracking-wider text-on-surface-variant">Latency</span><span class="text-[14px] font-bold text-secondary font-title-sm mt-0.5">14 ms</span></div><div class="bg-surface-container-low rounded-lg p-2 flex flex-col items-center justify-center text-center"><span class="text-[10px] font-label-sm uppercase tracking-wider text-on-surface-variant">Buffer</span><span class="text-[14px] font-bold text-on-surface font-title-sm mt-0.5">98% Free</span></div><div class="bg-surface-container-low rounded-lg p-2 flex flex-col items-center justify-center text-center"><span class="text-[10px] font-label-sm uppercase tracking-wider text-on-surface-variant">PPG Sensor</span><span class="text-[14px] font-bold text-secondary font-title-sm mt-0.5">Active</span></div></div>
<!-- Hardware Action Controls -->
<div class="w-full flex flex-col space-y-1.5 pt-0.5">
<!-- Force Sync Button (Primary Pill) -->
<button class="w-full min-h-[46px] rounded-full bg-primary text-on-primary font-label-md text-label-md flex items-center justify-center space-x-2 active:scale-95 transition-transform duration-150 shadow-md" id="btn-force-sync" type="button">
<span class="material-symbols-outlined text-[18px]" id="sync-icon">cloud_sync</span>
<span id="sync-text" class="">Force Sync &amp; Push Tiles</span>
</button>
<!-- Ping Phone Pill (Tactile Secondary) -->
<button class="w-full min-h-[42px] rounded-full bg-surface-container-high text-primary-fixed-dim font-label-md text-label-md flex items-center justify-center space-x-2 active:scale-95 transition-transform duration-150" id="btn-ping-phone" type="button">
<span class="material-symbols-outlined text-[18px] text-secondary" id="ping-icon">ring_volume</span>
<span id="ping-text" class="">Ping Phone / Play Sound</span>
</button>
</div>
</div>
<!-- Bottom Page Carousel Indicator (Wear OS standard navigation) -->
<footer class="w-full flex items-center justify-center space-x-1.5 pb-0.5 shrink-0 z-20"><span class="w-1.5 h-1.5 rounded-full bg-on-surface-variant/40"></span><span class="w-1.5 h-1.5 rounded-full bg-primary"></span><span class="w-1.5 h-1.5 rounded-full bg-on-surface-variant/40"></span></footer>
<script>
    (function () {
      const syncBtn = document.getElementById('btn-force-sync');
      const syncIcon = document.getElementById('sync-icon');
      const syncText = document.getElementById('sync-text');

      const pingBtn = document.getElementById('btn-ping-phone');
      const pingIcon = document.getElementById('ping-icon');
      const pingText = document.getElementById('ping-text');

      let isSyncing = false;
      let isPinging = false;

      if (syncBtn) {
        syncBtn.addEventListener('click', function () {
          if (isSyncing) return;
          isSyncing = true;
          syncIcon.classList.add('animate-spin');
          syncText.textContent = 'Pushing Telemetry...';
          syncBtn.classList.replace('bg-primary', 'bg-primary-container');

          setTimeout(() => {
            syncIcon.classList.remove('animate-spin');
            syncIcon.textContent = 'done_all';
            syncText.textContent = 'Tiles Synced (0ms)';
            syncBtn.classList.replace('bg-primary-container', 'bg-secondary-container');
            syncBtn.classList.replace('text-on-primary', 'text-on-secondary-container');

            setTimeout(() => {
              syncIcon.textContent = 'cloud_sync';
              syncText.textContent = 'Force Sync & Push Tiles';
              syncBtn.classList.replace('bg-secondary-container', 'bg-primary');
              syncBtn.classList.replace('text-on-secondary-container', 'text-on-primary');
              isSyncing = false;
            }, 1800);
          }, 1400);
        });
      }

      if (pingBtn) {
        pingBtn.addEventListener('click', function () {
          if (isPinging) return;
          isPinging = true;
          pingIcon.classList.add('animate-bounce');
          pingText.textContent = 'Pinging Companion...';
          pingBtn.classList.add('bg-tertiary-container');

          setTimeout(() => {
            pingIcon.classList.remove('animate-bounce');
            pingText.textContent = 'Phone Responded 🔊';

            setTimeout(() => {
              pingText.textContent = 'Ping Phone / Play Sound';
              pingBtn.classList.remove('bg-tertiary-container');
              isPinging = false;
            }, 1500);
          }, 1200);
        });
      }
    })();
  </script>
</div></main></div>

</body></html>

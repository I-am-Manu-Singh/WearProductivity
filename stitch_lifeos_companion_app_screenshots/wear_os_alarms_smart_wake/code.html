:"700"}],"display-md-mobile":["32px",{"lineHeight":"40px","letterSpacing":"-0.01em","fontWeight":"700"}],"label-sm":["10px",{"lineHeight":"14px","letterSpacing":"0.06em","fontWeight":"700"}],"title-lg":["20px",{"lineHeight":"26px","letterSpacing":"0em","fontWeight":"500"}]}}}}</script></head><body class="bg-[#000000] text-on-surface select-none flex justify-center items-center min-h-screen overflow-x-hidden"><div class="relative w-[384px] h-[384px] max-w-full rounded-full bg-[#000000] overflow-hidden flex flex-col justify-between shadow-[0_0_60px_rgba(0,0,0,0.9)]"><main class="flex-1 flex flex-col relative w-full px-4 pb-6 bg-[#000000] overflow-y-auto overflow-x-hidden pt-safe"><div class="flex flex-col w-full items-center text-on-surface select-none pb-4">

        </span>

<button aria-label="Toggle Hero Alarm" class="relative w-12 h-7 rounded-full bg-secondary p-0.5 transition-colors duration-200 focus:outline-none" id="mainAlarmToggle" onclick="toggleHeroAlarm()">

<span class="material-symbols-outlined text-secondary text-[14px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
</div>
<div class="flex items-center gap-1.5 flex-wrap">
<div class="flex items-center gap-1 bg-surface-container-lowest/80 px-2.5 py-1 rounded-full">
<span class="material-symbols-outlined text-secondary text-[14px]">auto_awesome</span>

</div>
<div class="flex items-center gap-1 bg-surface-container-lowest/80 px-2 py-1 rounded-full text-on-surface-variant">
<span class="material-symbols-outlined text-[13px]">repeat</span>

</div>
</div>
</div>
<div class="w-full mt-2">

</div>
<div class="w-full flex flex-col gap-1.5 mt-2.5">
<div class="w-full bg-surface-container rounded-lg p-2.5 flex items-center justify-between active:scale-[0.98] transition-all">
<div class="flex items-center gap-2.5">
<div class="w-8 h-8 rounded-full bg-tertiary-container/20 flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined text-[17px]">restaurant</span>
</div>
<div class="flex flex-col">
<div class="flex items-baseline gap-1">
<span class="font-title-md text-title-md text-on-surface">13:00</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">PM</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate max-w-[120px]">Fast Ends</span>
</div>
</div>
<button class="w-10 h-6 rounded-full bg-surface-variant p-0.5 transition-colors focus:outline-none" onclick="toggleSubAlarm(this)">
<div class="w-5 h-5 rounded-full bg-outline-variant translate-x-0 transition-transform"></div>
</button>
</div>
<div class="w-full bg-surface-container rounded-lg p-2.5 flex items-center justify-between active:scale-[0.98] transition-all">
<div class="flex items-center gap-2.5">
<div class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[17px]">bedtime</span>
</div>
<div class="flex flex-col">
<div class="flex items-baseline gap-1">
<span class="font-title-md text-title-md text-on-surface">22:30</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">PM</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate max-w-[120px]">Wind-Down</span>
</div>

<span class="material-symbols-outlined text-[18px]">mic</span>
<span class="">Add Alarm</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface-container-high text-on-surface flex items-center justify-center active:scale-95 transition-all" onclick="triggerQuickAdd()">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
</div>
<div class="flex items-center justify-center gap-1.5 mt-3">
<div class="w-3.5 h-1.5 rounded-full bg-primary transition-all"></div>

<div class="w-1.5 h-1.5 rounded-full bg-surface-variant"></div>
<div class="w-1.5 h-1.5 rounded-full bg-surface-variant"></div>
<div class="w-1.5 h-1.5 rounded-full bg-surface-variant"></div>
</div>
</div>
<script>
  let heroAlarmActive = true;
  const hapticModes = [
    { label: "Rhythmic Wave • L3", icon: "vibration" },
    { label: "Gentle Chime Pulse", icon: "graphic_eq" },
    { label: "Accelerando Burst", icon: "bolt" }
  ];
  let hapticIndex = 0;

  function toggleHeroAlarm() {
    heroAlarmActive = !heroAlarmActive;
    const btn = document.getElementById("mainAlarmToggle");
    const thumb = document.getElementById("mainAlarmThumb");
    if (heroAlarmActive) {
      btn.className = "relative w-12 h-7 rounded-full bg-secondary p-0.5 transition-colors duration-200 focus:outline-none";
      thumb.className = "w-6 h-6 rounded-full bg-on-secondary-fixed flex items-center justify-center translate-x-5 transition-transform duration-200";
      thumb.innerHTML = "<span class='material-symbols-outlined text-secondary text-[14px]' style=\"font-variation-settings: 'FILL' 1;\">check</span>";
    } else {
      btn.className = "relative w-12 h-7 rounded-full bg-surface-variant p-0.5 transition-colors duration-200 focus:outline-none";
      thumb.className = "w-6 h-6 rounded-full bg-outline-variant flex items-center justify-center translate-x-0 transition-transform duration-200";
      thumb.innerHTML = "";
    }
  }

  function toggleSubAlarm(btn) {
    const thumb = btn.firstElementChild;
    const isCurrentlyActive = btn.classList.contains("bg-secondary");
    if (isCurrentlyActive) {
      btn.classList.remove("bg-secondary");
      btn.classList.add("bg-surface-variant");
      thumb.classList.remove("translate-x-4", "bg-on-secondary-fixed");
      thumb.classList.add("translate-x-0", "bg-outline-variant");
    } else {
      btn.classList.remove("bg-surface-variant");
      btn.classList.add("bg-secondary");
      thumb.classList.remove("translate-x-0", "bg-outline-variant");
      thumb.classList.add("translate-x-4", "bg-on-secondary-fixed");
    }
  }

  function cycleHaptic() {
    hapticIndex = (hapticIndex + 1) % hapticModes.length;
    document.getElementById("hapticLabel").innerText = hapticModes[hapticIndex].label;
    document.getElementById("hapticIcon").innerText = hapticModes[hapticIndex].icon;
  }

  function triggerVoiceAlarm() {
    const btn = event.currentTarget;
    btn.classList.add("scale-95");
    setTimeout(() => btn.classList.remove("scale-95"), 150);
  }

  function triggerQuickAdd() {
    const btn = event.currentTarget;
    btn.classList.add("rotate-90");
    setTimeout(() => btn.classList.remove("rotate-90"), 200);
  }
</script></main></div>

</div>
</div>

</div>

<script>

  const joinBtn = document.getElementById('joinMeetBtn');

    joinBtn.addEventListener('click', () => {
      const originalText = joinBtn.innerHTML;
      joinBtn.innerHTML = '<span class="material-symbols-outlined text-[16px] animate-spin">sync</span><span>Connecting</span>';
      setTimeout(() => {
        joinBtn.innerHTML = originalText;
      }, 1800);
    });
  }

  const micBtn = document.getElementById('micDictationBtn');
  if (micBtn) {
    micBtn.addEventListener('click', () => {
      micBtn.classList.toggle('bg-error');
      micBtn.classList.toggle('text-on-error');
      setTimeout(() => {
        micBtn.classList.remove('bg-error', 'text-on-error');
      }, 1500);
    });

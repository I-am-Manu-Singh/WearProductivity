<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Pixel Watch 3 - Material You Active Face</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Roboto Flex & Google Sans equivalent -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<!-- BEGIN: Custom Styles -->
<style data-purpose="typography">
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .time-font {
      font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif;
      letter-spacing: -0.05em;
    }
  </style>
<style data-purpose="circular-geometry">
    /* Watch Face Pure 1:1 Circular Aspect Ratio */
    .watch-bezel {
      aspect-ratio: 1 / 1;
      width: min(92vw, 440px);
      box-shadow: 0 0 60px -10px rgba(0, 0, 0, 0.9), inset 0 0 20px 2px rgba(255, 255, 255, 0.03);
    }
    
    /* Radial Arc Stroke Animations */
    .stroke-dash-battery {
      stroke-dasharray: 283;
      stroke-dashoffset: 45; /* 84% fill */
    }
    .stroke-dash-habit {
      stroke-dasharray: 63;
      stroke-dashoffset: 16; /* 75% fill */
    }
  </style>
<style data-purpose="animations">
    @keyframes subtle-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.14); opacity: 0.8; }
    }
    .animate-heart-pulse {
      animation: subtle-pulse 1.25s ease-in-out infinite;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="bg-[#050608] min-h-screen w-full flex flex-col items-center justify-center p-3 text-slate-100 overflow-hidden select-none">
<!-- BEGIN: Smartwatch Physical Chassis Container -->
<main class="relative flex flex-col items-center justify-center">
<!-- Watch Hardware Frame -->
<div class="watch-bezel relative rounded-full bg-black border-[7px] border-[#181a1d] overflow-hidden flex items-center justify-center shadow-2xl" data-purpose="watch-bezel">
<!-- AMOLED Pure Black Display Canvas -->
<div class="relative w-full h-full bg-black rounded-full overflow-hidden flex flex-col items-center justify-between p-5 pt-4 pb-6" data-purpose="active-display">
<!-- BEGIN: Perimeter Tick Marks & Curved Peripheral Arcs -->
<svg class="absolute inset-0 w-full h-full pointer-events-none z-10" fill="none" viewBox="0 0 300 300">
<!-- Subtle 12, 3, 6, 9 Cardinal Ticks -->
<line stroke="#33383f" stroke-linecap="round" stroke-width="2" x1="150" x2="150" y1="8" y2="13"></line>
<line stroke="#33383f" stroke-linecap="round" stroke-width="2" x1="292" x2="287" y1="150" y2="150"></line>
<line stroke="#33383f" stroke-linecap="round" stroke-width="2" x1="150" x2="150" y1="292" y2="287"></line>
<line stroke="#33383f" stroke-linecap="round" stroke-width="2" x1="8" x2="13" y1="150" y2="150"></line>
<!-- Outer Battery Progress Arc (Right Bezel Segment) -->
<!-- Track -->
<circle cx="150" cy="150" r="139" stroke="#1f2328" stroke-dasharray="140 400" stroke-linecap="round" stroke-width="4.5" transform="rotate(35 150 150)"></circle>
<!-- Active Gauge (84% Terracotta to Mint Gradient Accent) -->
<circle cx="150" cy="150" r="139" stroke="url(#batteryGrad)" stroke-dasharray="112 400" stroke-dashoffset="0" stroke-linecap="round" stroke-width="4.5" transform="rotate(35 150 150)"></circle>
<defs>
<linearGradient id="batteryGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#ff8965"></stop>
<stop offset="60%" stop-color="#fdba74"></stop>
<stop offset="100%" stop-color="#55e2b0"></stop>
</linearGradient>
</defs>
</svg>
<!-- Peripheral Battery Micro-Label & Glyphs -->
<div class="absolute right-[22px] top-[148px] z-20 flex items-center gap-0.5 text-[11px] font-bold text-[#55e2b0] tracking-tight">
<svg class="w-3 h-3 text-[#55e2b0]" fill="currentColor" viewBox="0 0 24 24">
<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
</svg>
<span class="">84%</span>
</div>
<!-- END: Perimeter Tick Marks & Curved Peripheral Arcs -->
<!-- BEGIN: Top Complication - Intermittent Fasting Status -->
<section class="relative z-20 mt-1" data-purpose="top-complication-fasting">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#1e2329]/90 border border-white/5 backdrop-blur-md shadow-sm">
<!-- Flame / Metabolic State Icon -->
<span class="flex items-center justify-center text-[#ff8965]">
<svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 23c-4.97 0-9-3.8-9-8.5 0-3.6 2.5-6.8 5-9 0 0 .5-.5 1-.8-.2 1.3.1 2.7.9 3.8.2.3.6.4.9.2.3-.2.4-.6.3-.9-.4-1.6.1-3.3 1.1-4.6 2.3 2.1 4.5 4.8 5.4 7.8.2.7.3 1.4.3 2 0 5.5-4 10-5 10zm-1-6.5c0 1.4 1.1 2.5 2.5 2.5s2.5-1.1 2.5-2.5c0-1.8-1.5-3.2-2.5-4.5-1 1.3-2.5 2.7-2.5 4.5z"></path>
</svg>
</span>
<span class="text-[12px] font-semibold text-slate-200 tracking-tight">14H 38M</span>
<span class="w-1 h-1 rounded-full bg-slate-500"></span>
<span class="text-[12px] font-medium text-[#ff8965]">Ketosis</span>
</div>
</section>
<!-- END: Top Complication - Intermittent Fasting Status -->
<!-- BEGIN: Center Dial - Expressive Time & Date Core -->
<section class="relative z-20 flex flex-col items-center justify-center -my-1 text-center w-full" data-purpose="center-dial">
<!-- Secondary Date & Companion Label -->
<div class="flex items-center gap-1.5 text-[12px] font-bold tracking-wider text-slate-300 uppercase mb-0.5">
<span class="">WED, OCT 25</span>
<span class="w-1.5 h-1.5 rounded-full bg-[#769bff]"></span>
<span class="text-slate-400 font-semibold tracking-normal capitalize">LifeOS</span>
</div>
<!-- Big Expressive MD3 Digital Time Display -->
<div class="time-font text-[80px] leading-[0.92] font-black tracking-tighter text-[#e5efff] flex items-center justify-center drop-shadow-[0_4px_16px_rgba(255,255,255,0.06)]">
<span class="tracking-tight">10</span>
<span class="text-[#ff9d7e] mx-[1px] animate-pulse">:</span>
<span class="tracking-tight">42</span>
</div>
</section>
<!-- END: Center Dial - Expressive Time & Date Core -->
<!-- BEGIN: Middle Dual Complications (Heart & Habit Pods) -->
<section class="relative z-20 w-full px-2 flex items-center justify-center gap-3" data-purpose="mid-complications">
<!-- Left Pod: Biometrics (Heart Rate) -->
<div class="flex-1 max-w-[130px] h-[52px] px-2.5 py-1.5 rounded-full bg-[#161a1f] border border-white/5 flex items-center gap-2 shadow-inner" data-purpose="complication-heart">
<div class="relative w-8 h-8 rounded-full bg-[#102a24] flex items-center justify-center flex-shrink-0">
<svg class="w-4 h-4 text-[#55e2b0] animate-heart-pulse" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
</svg>
</div>
<div class="flex flex-col text-left leading-none">
<span class="text-[9.5px] font-bold text-slate-400 tracking-wider">HEART</span>
<div class="flex items-baseline gap-1 mt-0.5">
<span class="text-sm font-extrabold text-[#55e2b0]">72</span>
<span class="text-[8.5px] font-semibold text-slate-400">BPM</span>
</div>
</div>
</div>
<!-- Right Pod: Habit Radial Rings -->
<div class="flex-1 max-w-[130px] h-[52px] px-2.5 py-1.5 rounded-full bg-[#161a1f] border border-white/5 flex items-center justify-between shadow-inner" data-purpose="complication-habits">
<div class="flex flex-col text-left leading-none pl-1">
<span class="text-[9.5px] font-bold text-slate-400 tracking-wider">HABITS</span>
<span class="text-sm font-extrabold text-[#769bff] mt-0.5">3<span class="text-slate-400 font-semibold text-[11px]">/4</span></span>
</div>
<!-- Radial Mini Progress Ring -->
<div class="relative w-7 h-7 flex-shrink-0 flex items-center justify-center">
<svg class="w-7 h-7 -rotate-90" viewBox="0 0 32 32">
<circle cx="16" cy="16" fill="none" r="11" stroke="#252d3d" stroke-width="3"></circle>
<circle class="stroke-dash-habit" cx="16" cy="16" fill="none" r="11" stroke="#769bff" stroke-linecap="round" stroke-width="3"></circle>
</svg>
<!-- Icon in Center -->
<div class="absolute inset-0 flex items-center justify-center text-[#769bff]">
<svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24">
<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"></path>
</svg>
</div>
</div>
</div>
</section>
<!-- END: Middle Dual Complications (Heart & Habit Pods) -->
<!-- BEGIN: Bottom Hero Complication - Smart Alarm & Morning Routine -->
<section class="relative z-20 w-full px-2" data-purpose="bottom-hero-alarm">
<div class="w-full bg-[#171b20] hover:bg-[#1c2127] border border-white/[0.06] rounded-[24px] p-2 flex items-center justify-between transition-colors shadow-lg">
<!-- Left Side: Alarm Icon & Time Detail -->
<div class="flex items-center gap-2.5">
<div class="w-8 h-8 rounded-full bg-[#39241b] flex items-center justify-center text-[#ff9d7e] flex-shrink-0">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24">
<circle cx="12" cy="13" r="8"></circle>
<path d="M12 9v4l2 2"></path>
<path d="M5 3L2 6"></path>
<path d="M22 6l-3-3"></path>
</svg>
</div>
<div class="flex flex-col text-left leading-tight">
<div class="flex items-center gap-1.5">
<span class="text-[12.5px] font-extrabold text-white tracking-tight">06:45</span>
<span class="text-[9.5px] font-bold text-slate-400">AM</span>
</div>
<span class="text-[11px] font-medium text-slate-300 truncate max-w-[95px]">Morning Clarity</span>
</div>
</div>
<!-- Right Side: Gentle Haptic / Smart Wake Badge -->
<div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#1b2f28] border border-[#55e2b0]/20 text-[#55e2b0]">
<!-- Smart Vibrations Icon -->
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M18 8a6 6 0 0 1 0 8"></path>
<path d="M6 8a6 6 0 0 0 0 8"></path>
<rect height="14" rx="2" width="6" x="9" y="5"></rect>
</svg>
<span class="text-[10px] font-bold tracking-tight">Smart</span>
</div>
</div>
</section>
<!-- END: Bottom Hero Complication - Smart Alarm & Morning Routine -->
</div>
</div>
<!-- END: Watch Hardware Frame -->
<!-- BEGIN: Wear OS System Navigation Dots & Tiles Bar -->
<div class="mt-4 flex items-center justify-center gap-1.5" data-purpose="wearos-pagination-dots" aria-label="Page indicator"><span class="w-4 h-1.5 rounded-full bg-primary transition-all"></span><span class="w-1.5 h-1.5 rounded-full bg-surface-variant hover:bg-outline transition-all"></span><span class="w-1.5 h-1.5 rounded-full bg-surface-variant hover:bg-outline transition-all"></span><span class="w-1.5 h-1.5 rounded-full bg-surface-variant hover:bg-outline transition-all"></span></div>
<!-- END: Wear OS System Navigation Dots & Tiles Bar -->
</main>
<!-- END: Smartwatch Physical Chassis Container -->


</body></html>
